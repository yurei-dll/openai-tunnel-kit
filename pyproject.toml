[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-tunnel-kit"
version = "0.2.0"
description = "Portable profile and systemd tooling for tunnel-client and MCP setups"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yūrei.dll"}]
dependencies = []

[project.optional-dependencies]
wizard = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
openai-tunnel-kit = "openai_tunnel_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
