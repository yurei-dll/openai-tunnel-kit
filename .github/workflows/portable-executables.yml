name: Portable executables

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project and freezer
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller==6.21.0

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build single-file executable
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name openai-tunnel-kit \
            --paths src \
            src/openai_tunnel_kit/__main__.py

      - name: Smoke test executable
        run: |
          ./dist/openai-tunnel-kit --version
          config_dir="$(mktemp -d)"
          OPENAI_TUNNEL_KIT_CONFIG_DIR="$config_dir" ./dist/openai-tunnel-kit init smoke --binary /bin/true
          OPENAI_TUNNEL_KIT_CONFIG_DIR="$config_dir" ./dist/openai-tunnel-kit list-profiles | grep -Fx smoke

      - name: Package executable and checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          archive="openai-tunnel-kit-linux-${ARCH}.tar.gz"
          mkdir -p package
          install -m 0755 dist/openai-tunnel-kit package/openai-tunnel-kit
          tar -C package -czf "$archive" openai-tunnel-kit
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: openai-tunnel-kit-linux-${{ matrix.arch }}
          path: |
            openai-tunnel-kit-linux-${{ matrix.arch }}.tar.gz
            openai-tunnel-kit-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
